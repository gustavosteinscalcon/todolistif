<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Editar Tarefa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <h2>Editar Tarefa</h2>

    <form method="post" th:action="@{/edit/{id}(id=${todo.id})}">
        <label>Título:</label><br>
        <input type="text" name="title" th:value="${todo.title}" required /><br><br>

        <label>Prazo:</label><br>
        <input type="datetime-local" name="deadLine" th:value="${todo.deadLine}" required /><br><br>

        <button type="submit">Atualizar Tarefa</button>
        <a href="/">Cancelar</a>
    </form>
</body>

</html>
